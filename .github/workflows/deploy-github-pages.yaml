name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run install-plugins

      # The committed config has these off so drafts render on the local
      # dev server. The live site must always enforce them.
      - name: Enforce publish filters
        run: |
          node -e "
          const fs = require('fs'), YAML = require('yaml');
          const path = 'quartz.config.yaml';
          const gated = ['@quartz-community/remove-draft', '@quartz-community/explicit-publish'];
          const cfg = YAML.parse(fs.readFileSync(path, 'utf8'));
          const found = cfg.plugins.filter((p) => gated.includes(p.source));
          if (found.length !== gated.length) {
            throw new Error('publish filter plugins missing from config: got ' + found.length + ' of ' + gated.length);
          }
          for (const p of found) p.enabled = true;
          fs.writeFileSync(path, YAML.stringify(cfg));
          "

      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
